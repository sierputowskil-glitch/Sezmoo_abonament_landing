# Cloudflare Pages — local `wrangler pages dev` + dashboard deploy
name = "sezmoo-abonament"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

# Secrets (dashboard / `wrangler pages secret put` / `.dev.vars`):
#   TURNSTILE_SECRET_KEY
#   SMTP_PASS
#
# Optional vars (can also live in dashboard):
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_FROM, SMTP_FROM_NAME, MAIL_TO

[vars]
SMTP_HOST = "smtp.cyberfolks.pl"
SMTP_PORT = "587"
SMTP_USER = "no-reply@sezmoo.com"
SMTP_FROM = "no-reply@sezmoo.com"
SMTP_FROM_NAME = "SEZMOO"
MAIL_TO = "biuro@sezmoo.com"

# Contact form rate limit — production account (sezmoo.com / ae8539…).
# Staging (websky account) uses dashboard binding on sezmoo-abonament-staging.
[[kv_namespaces]]
binding = "CONTACT_RATE_LIMIT"
id = "75ef0bc2ea3f4274b94b58ff076b27e5"
preview_id = "75ef0bc2ea3f4274b94b58ff076b27e5"
