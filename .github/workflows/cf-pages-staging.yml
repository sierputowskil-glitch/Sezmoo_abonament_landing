name: Staging — Cloudflare Pages preview

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Astro check
        run: npm run check
      - name: Build Astro (preview / noindex)
        env:
          # Canonical for preview builds; real URL is *.sezmoo-abonament.pages.dev
          PUBLIC_SITE_URL: https://sezmoo-abonament.pages.dev
          PUBLIC_BASE_PATH: /
          PUBLIC_CONTACT_API_URL: /api/contact
          # Cloudflare Turnstile invisible always-pass test key
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000BB
          PUBLIC_ROBOTS: noindex
        run: npm run build
      - name: Publish preview to sezmoo-abonament
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.PROD_CLOUDFLARE_ACCOUNT_ID }}
          # Non-main branch → Pages preview (not production / abonament.sezmoo.com)
          command: pages deploy dist --project-name=sezmoo-abonament --branch=${{ github.ref_name }} --commit-dirty=true
